name: Backend Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv pip install --system -r backend/requirements-dev.txt

      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -p "test_*.py"
        env:
          PYTHONPATH: backend/src

      - name: Run quality evaluation
        run: python -m svandoc_backend.quality_eval
        env:
          PYTHONPATH: backend/src
          QUALITY_EVAL_GROUND_TRUTH_PATH: datasets/benchmark/v1/ground_truth.json
          QUALITY_EVAL_PREDICTIONS_PATH: datasets/benchmark/v1/ci_predictions.json
          QUALITY_EVAL_OUTPUT_PATH: .local-sandbox/quality-eval.json

      - name: Enforce quality thresholds
        run: python -m svandoc_backend.quality_gate
        env:
          PYTHONPATH: backend/src
          QUALITY_EVAL_OUTPUT_PATH: .local-sandbox/quality-eval.json
          QUALITY_THRESHOLD_METRIC: f1
          QUALITY_THRESHOLD_INVOICE: "0.92"
          QUALITY_THRESHOLD_RECEIPT: "0.88"
