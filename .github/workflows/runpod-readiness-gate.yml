name: RunPod Readiness Gate

on:
  workflow_call:
    inputs:
      ocr_default_model:
        required: false
        type: string
        default: rednote-hilab/dots.ocr
      ocr_fallback_model:
        required: false
        type: string
        default: datalab-to/chandra
    secrets:
      VLLM_BASE_URL:
        required: true
      VLLM_FALLBACK_BASE_URL:
        required: true
      VLLM_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      ocr_default_model:
        description: Primary OCR model ID
        required: false
        default: rednote-hilab/dots.ocr
      ocr_fallback_model:
        description: Fallback OCR model ID
        required: false
        default: datalab-to/chandra

jobs:
  runpod-readiness-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install backend dependencies
        run: uv pip install --system -r backend/requirements-dev.txt

      - name: Enforce RunPod readiness gate
        run: python -m svandoc_backend.deploy_gate
        env:
          PYTHONPATH: backend/src
          RUNPOD_READINESS_OUTPUT_PATH: .local-sandbox/runpod-readiness-gate.json
          VLLM_BASE_URL: ${{ secrets.VLLM_BASE_URL }}
          VLLM_FALLBACK_BASE_URL: ${{ secrets.VLLM_FALLBACK_BASE_URL }}
          VLLM_API_KEY: ${{ secrets.VLLM_API_KEY }}
          OCR_DEFAULT_MODEL: ${{ inputs.ocr_default_model || 'rednote-hilab/dots.ocr' }}
          OCR_FALLBACK_MODEL: ${{ inputs.ocr_fallback_model || 'datalab-to/chandra' }}

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runpod-readiness-gate-evidence
          path: .local-sandbox/runpod-readiness-gate.json
